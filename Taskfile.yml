version: "3"

vars:
  BINARY_NAME: stdb-go
  BUILD_DIR: build
  SPACETIMEDB_IMAGE: clockworklabs/spacetime:v2.0.5
  SPACETIMEDB_PORT: '{{.SPACETIMEDB_PORT | default "3000"}}'
  SPACETIMEDB_URL: '{{.SPACETIMEDB_URL | default "http://localhost"}}:{{.SPACETIMEDB_PORT}}'
  SPACETIMEDB_WS_URL: '{{.SPACETIMEDB_WS_URL | default "ws://localhost"}}:{{.SPACETIMEDB_PORT}}'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  LDFLAGS: >-
    -X main.pkgName={{.BINARY_NAME}}
    -X main.version={{.VERSION}}
    -X main.commit={{.COMMIT}}

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the binary
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - CGO_ENABLED=0 go build -trimpath -ldflags '-s -w -extldflags "-static" {{.LDFLAGS}}' -tags netgo,osusergo -o {{.BUILD_DIR}}/{{.BINARY_NAME}} .
    sources:
      - "*.go"
      - "internal/**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BUILD_DIR}}/{{.BINARY_NAME}}"

  test:
    desc: Run tests
    cmds:
      - go test -v -race -coverprofile=coverage.out ./...

  lint:
    desc: Run linters
    cmds:
      - golangci-lint run --timeout 5m ./...
      - go vet ./...

  fmt:
    desc: Format code
    cmds:
      - gofmt -w .

  install:
    desc: Install the binary to $GOPATH/bin
    cmds:
      - go install -ldflags "{{.LDFLAGS}}" .

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
      - rm -f coverage.out

  build-all:
    desc: Build for all supported platforms
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - |
        for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
          GOOS=${pair%/*}
          GOARCH=${pair#*/}
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          OUTPUT="{{.BUILD_DIR}}/{{.BINARY_NAME}}-${GOOS}-${GOARCH}${EXT}"
          echo "Building ${OUTPUT}..."
          CGO_ENABLED=0 GOOS=${GOOS} GOARCH=${GOARCH} go build \
            -trimpath -tags osusergo,netgo \
            -ldflags "-extldflags=-static -s -w {{.LDFLAGS}}" \
            -o "${OUTPUT}" .
        done

  mod:
    desc: Tidy and verify Go modules
    cmds:
      - go mod tidy
      - go mod verify

  build-wasm:
    desc: Build a test WASM module
    cmds:
      - go run . build --dir={{.CLI_ARGS | default "./testdata/comprehensive/input"}}

  publish:
    desc: Publish a test module to SpacetimeDB
    cmds:
      - go run . publish --dir={{.CLI_ARGS | default "./testdata/comprehensive/input"}} -d test-db

  golden-update:
    desc: Regenerate server codegen golden test files
    cmds:
      - go test -run TestGolden ./internal/servergen/ -update

  golden-update:client:
    desc: Regenerate client codegen golden test files
    cmds:
      - go test -run TestClientGen ./internal/clientgen/ -update

  generate:client:
    desc: Generate client bindings from a WASM binary or server
    cmds:
      - go run . generate client {{.CLI_ARGS}}

  test:integration:
    desc: Run integration tests (expects SpacetimeDB running)
    cmds:
      - go test -v -count=1 -tags=integration -timeout=5m -run TestIntegration ./...
    env:
      SPACETIMEDB_URL: '{{.SPACETIMEDB_URL | default "http://localhost:3000"}}'
      SPACETIMEDB_WS_URL: '{{.SPACETIMEDB_WS_URL | default "ws://localhost:3000"}}'

  spacetimedb:start:
    desc: Start SpacetimeDB Docker container on localhost:3000
    cmds:
      - docker run -d --replace --name spacetimedb-integration -p {{.SPACETIMEDB_PORT}}:3000 {{.SPACETIMEDB_IMAGE}} start --listen-addr 0.0.0.0:3000 --in-memory
      - echo "Waiting for SpacetimeDB to start..."
      - |
        for i in $(seq 1 30); do
          if curl -sf http://localhost:{{.SPACETIMEDB_PORT}}/v1/ping > /dev/null 2>&1; then
            echo "SpacetimeDB is ready"
            exit 0
          fi
          sleep 1
        done
        echo "SpacetimeDB failed to start within 30s"
        exit 1

  spacetimedb:stop:
    desc: Stop and remove SpacetimeDB Docker container
    cmds:
      - docker stop spacetimedb-integration 2>/dev/null || true
      - docker rm spacetimedb-integration 2>/dev/null || true

  test:integration:local:
    desc: Start SpacetimeDB, run integration tests, then stop
    cmds:
      - task: spacetimedb:start
      - defer: { task: spacetimedb:stop }
      - task: test:integration
